<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AR Multimedia Lab - Experiment 7</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        #info {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 10;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-family: Arial;
        }
    </style>
</head>

<body>

    <div id="info">
        Point the camera at the Hiro marker
    </div>

    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true"
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

        <!-- AR MARKER -->
        <a-marker
            preset="hiro"
            id="marker"
            emitevents="true">

            <!-- 3D GLB MODEL -->
            <a-entity
                id="model"
                gltf-model="model.glb"
                position="0 0 0"
                scale="0.5 0.5 0.5"
                rotation="0 0 0">
            </a-entity>

        </a-marker>

        <!-- CAMERA -->
        <a-entity camera></a-entity>

    </a-scene>

    <script>

        const marker = document.querySelector("#marker");
        const model = document.querySelector("#model");
        const info = document.querySelector("#info");

        // When marker is detected
        marker.addEventListener("markerFound", function () {

            info.innerHTML = "AR Target Detected - 3D Model Active";

            // Start rotating the model
            model.setAttribute(
                "animation",
                "property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear"
            );
        });

        // When marker is lost
        marker.addEventListener("markerLost", function () {

            info.innerHTML = "Point the camera at the Hiro marker";
        });

    </script>

</body>
</html>
